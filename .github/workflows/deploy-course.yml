name: Deploy Course

on:
  workflow_dispatch:
    inputs:
      course-json-path:
        description: 'Path to the course JSON file'
        required: true
        default: 'course_deploy.json'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # Checkout current repo
      - name: Checkout code
        uses: actions/checkout@v6

      # Checkout upload action repo 
      - name: Checkout Upload Action
        uses: actions/checkout@v4
        with:
          repository: qBraid/upload-course-action
          ref: v0.1.0-beta
          token: ${{ secrets.GH_TOKEN }}
          path: .github/actions/upload-action
          
      # Deploy to qbraid using the upload course action
      - name: Deploy to qBraid
        id: deploy
        uses: ./.github/actions/upload-action
        with:
          # the api key associated with the right organization user
          api-key: ${{ secrets.QBRAID_API_KEY }}

          repo-read-token: ${{ secrets.GH_TOKEN }}
          # input to the path of the course json file which has all the course details and
          # content to be deployed
          course-json-path: ${{ github.event.inputs.course-json-path }}

      - name: Deployment summary
        run: |
          echo "Course: ${{ steps.deploy.outputs.course_name }}"
          echo "Custom ID: ${{ steps.deploy.outputs.course-custom-id }}"
          echo "URL: ${{ steps.deploy.outputs.qbook_url }}"
